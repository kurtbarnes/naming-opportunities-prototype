<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Naming Opportunities Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="vendor.css">
<style>
  /* Chrome around the embedded app — approximates the RE NXT host shell.
     Everything below the tab strip uses the app's real, extracted CSS (vendor.css). */
  :root{
    --sky-blue: #0974a1;
    --sky-blue-dark: #065171;
    --sky-border: #cdcfd2;
    --sky-text: #212327;
    --sky-text-dim: #686c73;
    --sidebar-bg:#0d3854;
    --sidebar-icon:#a9c6d8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--sky-text);font-family:"Blackbaud Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;}

  .topbar{
    height:44px;display:flex;align-items:center;gap:16px;
    padding:0 12px;background:#fff;border-bottom:1px solid var(--sky-border);
  }
  .topbar .hamburger{font-size:18px;color:var(--sky-text-dim);cursor:pointer;}
  .topbar .brand{font-weight:600;font-size:14px;color:var(--sky-text);white-space:nowrap;}
  .topbar .search{
    flex:1;max-width:420px;display:flex;align-items:center;gap:6px;
    background:#f4f6f8;border-radius:4px;padding:6px 10px;color:#8a95a0;
  }
  .topbar .search input{border:0;background:transparent;outline:0;flex:1;font-size:13px;color:var(--sky-text);}
  .topbar .spacer{flex:1;}
  .topbar .icon{width:18px;height:18px;color:var(--sky-text-dim);}
  .topbar .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--sky-blue);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  }

  .app{display:flex;}
  .sidebar{
    width:44px;background:var(--sidebar-bg);min-height:calc(100vh - 44px);
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;
  }
  .sidebar .nav-icon{
    width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--sidebar-icon);cursor:pointer;font-size:15px;
  }
  .sidebar .nav-icon:hover{background:rgba(255,255,255,.08);color:#fff;}
  .sidebar .nav-icon.active{background:rgba(255,255,255,.14);color:#fff;}
  .sidebar .plus{
    width:28px;height:28px;border-radius:6px;background:#fff;color:var(--sidebar-bg);
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
    margin-bottom:12px;cursor:pointer;
  }

  .main{flex:1;padding:20px 28px 40px;max-width:1600px;}
  .eyebrow{text-align:right;font-size:11px;color:var(--sky-text-dim);margin-bottom:2px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .page-head h1{font-size:26px;font-weight:600;margin:0;color:var(--sky-text);display:flex;align-items:center;gap:10px;}
  .page-head h1 .home-crumb{cursor:pointer;color:var(--sky-text-dim);font-size:20px;}
  .page-head h1 .home-crumb:hover{color:var(--sky-blue);}
  .head-actions{display:flex;gap:8px;}

  /* ---- tabs / toolbar / grid (shared look, real sky-* classes) ---- */
  .count-row{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;}
  .count-row .count{font-size:14px;color:var(--sky-text);}

  .find-box{display:flex;align-items:center;height:32px;}
  .find-box input{border:1px solid var(--sky-border);border-right:0;border-radius:3px 0 0 3px;height:32px;padding:0 10px;font-size:13px;outline:0;width:220px;}
  .find-box button{border:1px solid var(--sky-border);border-left:0;border-radius:0 3px 3px 0;height:32px;width:34px;background:#fff;cursor:pointer;color:var(--sky-text-dim);}
  .chk-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sky-text-dim);white-space:nowrap;}

  .table-wrap{border:1px solid var(--sky-border);border-radius:4px;overflow:auto;}
  .sky-grid-table thead th{
    text-align:left;font-size:12px;color:var(--sky-text-dim);font-weight:600;padding:10px;
    border-bottom:1px solid var(--sky-border);white-space:nowrap;cursor:pointer;user-select:none;
    background:#fff;position:sticky;top:0;
  }
  .sky-grid-table thead th:hover{color:var(--sky-blue);}
  .sky-grid-table thead th.no-sort{cursor:default;}
  .sky-grid-table thead th.no-sort:hover{color:var(--sky-text-dim);}
  .sky-grid-table thead th .sort-arrow{font-size:10px;margin-left:4px;color:var(--sky-blue);}
  .sky-grid-table td.sky-grid-cell{padding:10px;vertical-align:top;font-size:13px;color:#3a444d;}
  .sky-grid-row:hover{background:#f0f7fb;}
  .sky-grid-row.selected{background:#eaf3fa;}
  .col-check{width:30px;}
  .col-icon{width:30px;text-align:center;}
  .row-icon-btn{
    background:#eef0f2;border:0;color:#7c8894;cursor:pointer;font-size:12px;padding:6px 7px;border-radius:50%;
    width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
  }
  .row-icon-btn:hover{color:var(--sky-blue);background:#dcecf4;}
  .name-link{color:var(--sky-blue);font-weight:600;cursor:pointer;text-decoration:none;}
  .name-link:hover{text-decoration:underline;}
  .loc-path{color:var(--sky-text-dim);font-size:12.5px;line-height:1.4;}
  .num{text-align:left;}

  .status-box{font-size:12px;font-weight:600;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;background:#eaf3fa;color:var(--sky-blue);
    border-radius:3px;padding:4px 10px;font-size:12.5px;font-weight:600;
  }
  .filter-chip .x{cursor:pointer;font-weight:700;}

  .footer-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;color:var(--sky-text-dim);font-size:12.5px;}
  .pager{display:flex;gap:4px;align-items:center;}
  .pager button{border:1px solid var(--sky-border);background:#fff;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--sky-text);}
  .pager button.active{background:var(--sky-blue);color:#fff;border-color:var(--sky-blue);}
  .pager button:hover:not(.active){background:#f4f6f8;}

  .context-menu-naming ul{list-style:none;margin:0;}
  .context-menu-naming li{padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--sky-text);}
  .context-menu-naming li:hover{background:#f4f6f8;}

  /* ---- Mapping card ---- */
  .map-card .card-head{background:#0d3854;border-radius:4px 4px 0 0;}
  .map-card .card-head h3{color:#fff;display:flex;align-items:center;gap:8px;}
  .map-card .card-head .drag{color:#6f92ab;}
  .map-intro{font-size:12.5px;color:var(--sky-text-dim);line-height:1.5;margin:0 0 12px;}
  .map-setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted var(--sky-border);font-size:13px;}
  .map-setting:last-of-type{border-bottom:0;}
  .map-setting label{color:var(--sky-text-dim);}
  .map-setting select{border:1px solid var(--sky-border);border-radius:3px;padding:4px 8px;font-size:12.5px;}
  .map-switch{position:relative;width:40px;height:22px;flex-shrink:0;}
  .map-switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .map-switch .track{position:absolute;inset:0;background:#c9ced3;border-radius:11px;transition:background .15s;pointer-events:none;}
  .map-switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;}
  .map-switch input:checked + .track{background:#2f9e44;}
  .map-switch input:checked + .track::after{transform:translateX(18px);}
  .map-colors{display:flex;flex-wrap:wrap;gap:12px;padding:10px 0 4px;}
  .map-colors label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sky-text-dim);}
  .map-colors input[type=color]{width:34px;height:24px;border:1px solid var(--sky-border);padding:0;background:none;border-radius:3px;}
  .map-colors input[type=text]{width:56px;border:1px solid var(--sky-border);border-radius:3px;padding:4px 6px;font-size:12.5px;}
  .map-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .map-snippet{margin-top:10px;background:#0f1e2e;color:#e9d9ae;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;padding:10px 12px;border-radius:4px;white-space:pre-wrap;word-break:break-all;display:none;}
  .map-snippet.show{display:block;}
  .map-note{font-size:11.5px;color:var(--sky-text-dim);font-style:italic;margin-top:10px;}

  /* ---- Admin Settings cards ---- */
  .admin-columns{display:flex;gap:20px;align-items:flex-start;}
  .admin-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;}
  .card{border:1px solid var(--sky-border);border-radius:4px;background:#fff;}
  .card-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--sky-border);}
  .card-head h3{margin:0;font-size:15px;font-weight:600;color:var(--sky-text);}
  .card-head .drag{color:#b7bcc2;cursor:grab;letter-spacing:1px;}
  .card-body{padding:12px 16px;}
  .card-body .sky-btn{margin-bottom:10px;}
  .list-item{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--sky-border);font-size:13px;
  }
  .list-item:last-child{border-bottom:0;}
  .list-item .ellipsis-btn{
    background:transparent;border:0;color:#9ba3ab;cursor:pointer;font-size:13px;width:20px;
  }
  .list-item a{color:var(--sky-blue);cursor:pointer;text-decoration:none;}
  .list-item a:hover{text-decoration:underline;}
  .mini-table{width:100%;border-collapse:collapse;font-size:13px;}
  .mini-table th{text-align:left;font-weight:600;color:var(--sky-text-dim);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--sky-border);}
  .mini-table td{padding:8px 4px;border-bottom:1px dotted var(--sky-border);vertical-align:top;}
  .mini-table tr:last-child td{border-bottom:0;}
  .checkbox-yes{color:#3a9c53;}

  /* ---- Dashboard ---- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 60px;padding:20px 4px 28px;}
  .stat-tile{text-align:center;}
  .stat-tile .stat-num{font-size:30px;font-weight:600;color:var(--sky-text);}
  .stat-tile .stat-num.green{color:#2f9e44;}
  .stat-tile .stat-num.red{color:#e03131;}
  .stat-tile .stat-label{font-size:13px;color:var(--sky-text-dim);margin-top:2px;}
  .approval-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px dotted var(--sky-border);}
  .approval-row:last-child{border-bottom:0;}
  .approval-row .a-title{color:var(--sky-blue);font-weight:600;text-decoration:none;cursor:pointer;}
  .approval-row .a-sub{font-size:12.5px;color:var(--sky-text-dim);margin-top:2px;}
  .section-label{font-weight:600;font-size:15px;margin:22px 0 8px;color:var(--sky-text);}

  /* ---- Detail view ---- */
  .detail-summary{font-size:13px;color:var(--sky-text);line-height:1.9;margin-bottom:14px;}
  .detail-summary b{font-weight:600;}
  .detail-columns{display:flex;gap:20px;align-items:flex-start;}
  .detail-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:13px;}
  .kv-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--sky-border);}
  .kv-row .k{color:var(--sky-text-dim);}
  .kv-row .v{font-weight:500;text-align:right;}
  .kv-row .v a{color:var(--sky-blue);text-decoration:none;}
  .kv-row .v.muted{color:#9aa0a6;font-style:italic;font-weight:400;}
  .empty-note{color:var(--sky-text-dim);font-size:13px;text-align:center;padding:20px 0;}
  .instance-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dotted var(--sky-border);}
  .instance-row:last-child{border-bottom:0;}
  .instance-row .i-left{display:flex;align-items:center;gap:10px;}
  .instance-row a{color:var(--sky-blue);text-decoration:none;cursor:pointer;}
  .instance-row a:hover{text-decoration:underline;}
  .badge-num{background:#eef0f2;border-radius:3px;padding:2px 7px;font-size:12px;color:var(--sky-text-dim);}

  .back-arrow{cursor:pointer;color:var(--sky-text-dim);font-size:18px;margin-right:2px;}
  .back-arrow:hover{color:var(--sky-blue);}
  .dl-grid{font-size:13px;}
  .dl-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted var(--sky-border);}
  .dl-row:last-child{border-bottom:0;}
  .dl-row .k{color:var(--sky-text-dim);}
  .dl-row .v a{color:var(--sky-blue);text-decoration:none;}
  .dl-row .v a:hover{text-decoration:underline;}
  .dl-row .v.muted{color:#9aa0a6;font-style:italic;}
  .gift-note{color:var(--sky-text-dim);font-size:12px;margin-top:2px;}
  .attach-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dotted var(--sky-border);}
  .attach-row:last-child{border-bottom:0;}
  .attach-row .a-name{color:var(--sky-blue);font-weight:600;}
  .attach-row .a-meta{font-size:12px;color:var(--sky-text-dim);}

  /* ---- Drawer ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,30,38,.35);display:none;z-index:50;}
  .overlay.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:420px;background:#fff;
    box-shadow:-6px 0 18px rgba(0,0,0,.15);transform:translateX(100%);
    transition:transform .22s ease;z-index:51;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--sky-border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h2{margin:0;font-size:17px;font-weight:600;}
  .drawer-head .close{cursor:pointer;color:#8a95a0;font-size:18px;background:none;border:0;}
  .drawer-body{padding:18px 22px;overflow-y:auto;flex:1;}
  .field{margin-bottom:16px;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--sky-border);border-radius:3px;padding:8px 10px;
    font-size:13px;color:var(--sky-text);font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .drawer-foot{padding:14px 22px;border-top:1px solid var(--sky-border);display:flex;gap:10px;justify-content:flex-end;}

  .columns-pop{
    position:absolute;background:#fff;border:1px solid var(--sky-border);border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);padding:10px 4px;z-index:40;min-width:200px;display:none;
  }
  .columns-pop.open{display:block;}
  .columns-pop label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;color:var(--sky-text);cursor:pointer;}
  .columns-pop label:hover{background:#f4f6f8;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:#26313a;color:#fff;padding:10px 18px;
    border-radius:4px;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="topbar">
  <span class="hamburger">&#9776;</span>
  <span class="brand">Raiser's Edge NXT</span>
  <div class="search">
    <span>&#128269;</span>
    <input placeholder="Search" />
  </div>
  <div class="spacer"></div>
  <span class="icon">&#128276;</span>
  <span class="icon">&#128179;</span>
  <div class="avatar">KB</div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="plus">+</div>
    <div class="nav-icon">&#8962;</div>
    <div class="nav-icon">&#128100;</div>
    <div class="nav-icon">&#128179;</div>
    <div class="nav-icon">&#128101;</div>
    <div class="nav-icon">&#9993;</div>
    <div class="nav-icon active">&#127991;</div>
    <div class="nav-icon">&#128202;</div>
    <div class="nav-icon">&#9881;</div>
    <div class="nav-icon">&#128203;</div>
    <div class="nav-icon">&#9998;</div>
  </div>

  <div class="main">
    <div class="eyebrow">SKY Developer Cohort</div>

    <!-- ================= LIST-TABS VIEW ================= -->
    <div id="tabsView">
      <div class="page-head">
        <h1>Naming Opportunities</h1>
        <div class="head-actions">
          <button class="sky-btn sky-btn-default">Objects</button>
          <button class="sky-btn sky-btn-default">Instances</button>
        </div>
      </div>

      <div class="sky-tabset sky-tabset-mode-tabs sky-tabset-style-tabs">
        <span class="sky-tabset-tabs" id="tabStrip">
          <div class="sky-btn-tab-wrapper"><button class="sky-btn-tab" data-tab="admin">Admin Settings</button></div>
          <div class="sky-btn-tab-wrapper"><button class="sky-btn-tab" data-tab="list">Naming Opportunity List</button></div>
          <div class="sky-btn-tab-wrapper"><button class="sky-btn-tab" data-tab="instances">Instance List</button></div>
          <div class="sky-btn-tab-wrapper"><button class="sky-btn-tab" data-tab="dashboard">Dashboard</button></div>
        </span>
      </div>

      <!-- ---- Naming Opportunity List panel ---- -->
      <div id="panel-list" class="tab-panel">
        <div class="count-row"><div class="count"><span id="rowCount">0</span> Naming Opportunities</div></div>
        <div class="sky-toolbar-section">
          <div class="sky-toolbar-section-items">
            <div class="sky-toolbar-item">
              <button class="sky-btn new-fund-btn sky-btn-primary" id="newBtn" data-sky-id="event-add">
                <i class="fa fa-plus-circle"></i> New naming opportunity
              </button>
            </div>
            <div class="sky-toolbar-item">
              <div class="disp-flex padtop10 padbot10 searchparticipantscontainer">
                <input type="text" id="findInput" placeholder="Find in this list">
                <button id="findGoBtn"><i class="fa fa-search"></i></button>
              </div>
            </div>
            <div class="sky-toolbar-item">
              <label class="chk-label"><input type="checkbox" id="includeInactive"> Include inactive</label>
            </div>
            <div class="sky-toolbar-item">
              <button class="sky-btn sky-btn-default" id="filterBtn"><i class="fa fa-filter"></i> Filter</button>
            </div>
          </div>
          <div style="flex:1"></div>
          <div class="sky-toolbar-section-items">
            <div class="sky-toolbar-item"><button class="sky-btn sky-btn-default"><i class="fa fa-arrow-up"></i> Export</button></div>
            <div class="sky-toolbar-item"><button class="sky-btn sky-btn-default" id="resetBtn"><i class="fa fa-refresh"></i> Reset</button></div>
            <div class="sky-toolbar-item" style="position:relative;">
              <button class="sky-btn sky-btn-default" id="columnsBtn"><i class="fa fa-bars"></i> Columns</button>
              <div class="columns-pop" id="columnsPop"></div>
            </div>
          </div>
        </div>
        <div class="table-wrap sky-grid">
          <div class="sky-grid-table-container">
            <table class="sky-grid-table w-full">
              <thead><tr id="headRow"></tr></thead>
              <tbody class="sky-grid-tbody" id="tbody"></tbody>
            </table>
          </div>
        </div>
        <div class="footer-row">
          <div id="footerCount"></div>
          <div class="pager" id="pager"></div>
        </div>
      </div>

      <!-- ---- Admin Settings panel ---- -->
      <div id="panel-admin" class="tab-panel hidden" style="padding-top:16px;"></div>

      <!-- ---- Instance List panel ---- -->
      <div id="panel-instances" class="tab-panel hidden"></div>

      <!-- ---- Dashboard panel ---- -->
      <div id="panel-dashboard" class="tab-panel hidden"></div>
    </div>

    <!-- ================= RECORD DETAIL VIEW ================= -->
    <div id="detailView" class="hidden"></div>

    <!-- ================= INSTANCE DETAIL VIEW ================= -->
    <div id="instanceDetailView" class="hidden"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">New naming opportunity</h2>
    <button class="close" id="drawerClose">&times;</button>
  </div>
  <div class="drawer-body">
    <div class="field"><label class="sky-control-label"><span>Name</span></label><input id="f-name"></div>
    <div class="field"><label class="sky-control-label"><span>Description</span></label><textarea id="f-desc"></textarea></div>
    <div class="field"><label class="sky-control-label"><span>Location</span></label><input id="f-loc"></div>
    <div class="field"><label class="sky-control-label"><span>Type</span></label>
      <select id="f-type"><option>Internal</option><option>General</option><option>Outdoor</option></select>
    </div>
    <div class="field"><label class="sky-control-label"><span>Specialty / Department</span></label><input id="f-dept"></div>
    <div class="field"><label class="sky-control-label"><span>Status</span></label>
      <select id="f-status"><option>Available</option><option>Assigned</option><option>Proposed</option><option>Inactive</option></select>
    </div>
    <div class="field"><label class="sky-control-label"><span>Ask Amount</span></label><input id="f-ask" type="number"></div>
    <div class="field"><label class="sky-control-label"><span>Quantity</span></label><input id="f-qty" type="number" value="1"></div>
  </div>
  <div class="drawer-foot">
    <button class="sky-btn sky-btn-default" id="cancelBtn">Cancel</button>
    <button class="sky-btn sky-btn-primary" id="saveBtn">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Sample data — all fictional. Structure mirrors the real production app.
   ===================================================================== */
const TYPES = ["Internal","General","Outdoor"];
const DEPTS = ["Orthopedics","General","Cardiac","Oncology","Neurology","Pediatrics"];
const FUNDS = ["Natural Disaster Relief Fund","Building Fund","Acquisition Fund","Endowment Fund"];
const CAMPAIGNS = ["Planned Giving Campaign","Capital Campaign","Endowment Campaign"];
const PEOPLE = ["Jordan Lee","Taylor Kim","Morgan Patel","Casey Nguyen","Sam Rivera","Riley Cooper","Alex Chen","Jamie Torres","Drew Bennett"];
const NAME_POOL = [
  ["Patient Rm"],["Group Study Room"],["Staff Lounge"],
  ["Instructional and Research Consultation Room"],["Associate Director of Library Services Offices"],
  ["Learning Commons Technology Area"],["Conference Room"],["Nurses Station"],
  ["Physician Suite"],["Rehabilitation Gym"]
];
const LOC_PATHS = [
  "Example Medical Center > FLOOR 12",
  "Campus > Theatre > 1st Floor",
  "Campus > Main Building > 2nd Floor",
  "Example Medical Center > FLOOR 8"
];
const STATUSES = ["Assigned","Available","Available","Proposed"];

function makeRow(i){
  const [base] = NAME_POOL[i % NAME_POOL.length];
  const num = 12000 + i;
  const isRoom = base.includes("Rm") || base.includes("Room");
  const name = isRoom ? `${base} ${num}` : base;
  const status = STATUSES[i % STATUSES.length];
  const qty = 1;
  return {
    id: i+1,
    name,
    desc: isRoom ? name : (i % 5 === 0 ? "Will accommodate up to " + (6 + (i%4)*2) + " students" : base + " description"),
    loc: LOC_PATHS[i % LOC_PATHS.length],
    type: TYPES[i % TYPES.length],
    dept: DEPTS[i % DEPTS.length],
    status,
    qty,
    available: status === "Assigned" ? 0 : qty,
    askAmount: [10000,15000,50000,75000,500000][i % 5],
    fund: FUNDS[i % FUNDS.length],
    campaign: CAMPAIGNS[i % CAMPAIGNS.length],
    assignedInstance: status === "Assigned" ? `${PEOPLE[i % PEOPLE.length]} - ${name}` : null
  };
}

let DATA = Array.from({length: 64}, (_,i) => makeRow(i));

const COLUMNS = [
  {key:"name", label:"Name"},
  {key:"desc", label:"Description"},
  {key:"loc", label:"Location"},
  {key:"type", label:"Type"},
  {key:"dept", label:"Specialty/Department"},
  {key:"askAmount", label:"Ask Amount"},
  {key:"status", label:"Status"},
  {key:"qty", label:"Quantity"},
  {key:"available", label:"Available"},
];
let visibleCols = new Set(COLUMNS.map(c=>c.key));

let sortKey = null, sortDir = 1;
let searchTerm = "";
let page = 1;
const PAGE_SIZE = 12;
let editingId = null;
let openMenuId = null;
let currentTab = "list";
let detailId = null;

function money(n){ return "$" + n.toLocaleString(); }

/* =====================================================================
   Naming Opportunity List
   ===================================================================== */
function filteredData(){
  let rows = DATA;
  if(searchTerm.trim()){
    const t = searchTerm.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(t) || r.desc.toLowerCase().includes(t) || r.dept.toLowerCase().includes(t));
  }
  if(sortKey){
    rows = [...rows].sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av-bv) * sortDir;
    });
  }
  return rows;
}

function renderHead(){
  const head = document.getElementById("headRow");
  let html = `<th class="col-check"><input type="checkbox" id="selectAll"></th>
              <th class="col-icon"></th><th class="col-icon"></th><th class="col-icon"></th><th class="col-icon"></th>`;
  COLUMNS.forEach(c=>{
    if(!visibleCols.has(c.key)) return;
    let arrow = "";
    if(sortKey === c.key) arrow = `<span class="sort-arrow">${sortDir===1?"▲":"▼"}</span>`;
    html += `<th data-key="${c.key}">${c.label}${arrow}</th>`;
  });
  head.innerHTML = html;
  head.querySelectorAll("th[data-key]").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      renderAll();
    });
  });
  document.getElementById("selectAll").addEventListener("change", (e)=>{
    document.querySelectorAll(".row-select").forEach(cb=>{ cb.checked = e.target.checked; cb.dispatchEvent(new Event('change')); });
  });
}

function statusBox(status){
  return `<div data-status="${status}" class="sky-label status-box">${status}</div>`;
}

function renderBody(){
  const rows = filteredData();
  document.getElementById("rowCount").textContent = DATA.length;
  const start = (page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = pageRows.map(r=>{
    let cells = "";
    COLUMNS.forEach(c=>{
      if(!visibleCols.has(c.key)) return;
      if(c.key === "name"){
        cells += `<td class="sky-grid-cell"><a class="name-link" data-id="${r.id}">${r.name}</a></td>`;
      } else if(c.key === "loc"){
        cells += `<td class="sky-grid-cell loc-path">${r.loc}</td>`;
      } else if(c.key === "status"){
        cells += `<td class="sky-grid-cell">${statusBox(r.status)}</td>`;
      } else if(c.key === "askAmount"){
        cells += `<td class="sky-grid-cell num">${money(r.askAmount)}</td>`;
      } else if(c.key === "qty" || c.key === "available"){
        cells += `<td class="sky-grid-cell num">${r[c.key]}</td>`;
      } else {
        cells += `<td class="sky-grid-cell">${r[c.key]}</td>`;
      }
    });
    return `<tr class="sky-grid-row" data-id="${r.id}">
      <td class="sky-grid-cell col-check"><input type="checkbox" class="row-select" data-id="${r.id}"></td>
      <td class="sky-grid-cell col-icon"><button class="row-icon-btn edit-icon" data-id="${r.id}" title="Edit"><i class="fa fa-pencil"></i></button></td>
      <td class="sky-grid-cell col-icon"><button class="row-icon-btn" title="Remove"><i class="fa fa-times-circle"></i></button></td>
      <td class="sky-grid-cell col-icon"><button class="row-icon-btn" title="Assign"><i class="fa fa-user-plus"></i></button></td>
      <td class="sky-grid-cell col-icon"><button class="row-icon-btn" title="Notes"><i class="fa fa-file-text"></i></button></td>
      ${cells}
    </tr>`;
  }).join("");

  tbody.querySelectorAll(".name-link").forEach(el=>{
    el.addEventListener("click", ()=> openDetail(Number(el.dataset.id)));
  });
  tbody.querySelectorAll(".edit-icon").forEach(el=>{
    el.addEventListener("click", ()=> openDrawer(Number(el.dataset.id)));
  });
  tbody.querySelectorAll(".row-select").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      cb.closest("tr").classList.toggle("selected", cb.checked);
    });
  });

  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(page > totalPages) page = totalPages;
  document.getElementById("footerCount").textContent =
    total === 0 ? "No results" : `Showing ${start+1}-${Math.min(start+PAGE_SIZE,total)} of ${total}`;

  const pager = document.getElementById("pager");
  let phtml = `<button ${page===1?"disabled":""} id="prevPage">&#8249;</button>`;
  for(let p=1; p<=totalPages; p++){
    phtml += `<button class="${p===page?"active":""}" data-p="${p}">${p}</button>`;
  }
  phtml += `<button ${page===totalPages?"disabled":""} id="nextPage">&#8250;</button>`;
  pager.innerHTML = phtml;
  pager.querySelectorAll("button[data-p]").forEach(b=>{
    b.addEventListener("click", ()=>{ page = Number(b.dataset.p); renderBody(); });
  });
  const prevBtn = document.getElementById("prevPage");
  const nextBtn = document.getElementById("nextPage");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ if(page>1){page--; renderBody();} });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ if(page<totalPages){page++; renderBody();} });
}

function renderColumnsPop(){
  const pop = document.getElementById("columnsPop");
  pop.innerHTML = COLUMNS.map(c=>`
    <label><input type="checkbox" data-key="${c.key}" ${visibleCols.has(c.key)?"checked":""}> ${c.label}</label>
  `).join("");
  pop.querySelectorAll("input").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.checked) visibleCols.add(cb.dataset.key); else visibleCols.delete(cb.dataset.key);
      renderAll();
    });
  });
}

function renderAll(){
  renderHead();
  renderBody();
}

    <div class="card-body">
      <button class="sky-btn sky-btn-default"><i class="fa fa-plus"></i> Add</button>
      ${opts.extraBtn || ""}
      ${opts.showInactive ? `<label class="chk-label" style="float:right;margin-top:8px;"><input type="checkbox"> Show Inactive</label>` : ""}
      <div style="clear:both;"></div>
      ${items.map(t => `<div class="list-item"><button class="ellipsis-btn"><i class="fa fa-ellipsis-h"></i></button><a>${t}</a></div>`).join("")}
    </div>
  </div>`;
}

function tableCard(title, headers, rows){
  return `<div class="card">
    <div class="card-head"><h3>${title}</h3><span class="drag">&#8942;&#8942;</span></div>
    <div class="card-body">

const MAPPING_URL = "https://kurtbarnes.github.io/naming-opportunities-mapping/";
const mappingSettings = {
  enabled: true,
  campus: "campus-riverbend",
  visitorDefault: "all",
  org: "Riverbend Campus",
  logo: "R",
  accent: "#C89A4C",
  header: "#0F1E2E",
  page: "#F7F4EC"
};

function mappingLaunchUrl(session){
  const p = new URLSearchParams({
    session: session || "admin",
    campus: mappingSettings.campus,
    visdefault: mappingSettings.visitorDefault,
    org: mappingSettings.org,
    logo: mappingSettings.logo,
    accent: mappingSettings.accent,
    header: mappingSettings.header,
    page: mappingSettings.page
  });
  return MAPPING_URL + "?" + p.toString();
}
function mappingEmbedSnippet(){
  const p = new URLSearchParams({
    campus: mappingSettings.campus, org: mappingSettings.org, logo: mappingSettings.logo,
    accent: mappingSettings.accent, header: mappingSettings.header, page: mappingSettings.page, height: "680"
  });
  return '<div id="naming-map"></div>\n<script src="' + MAPPING_URL + 'embed.js"\n  data-config="' + p.toString() + '" async><\/script>';
}

        <button class="sky-btn sky-btn-default" id="map-embedbtn"><i class="fa fa-code"></i> Embed code</button>
      </div>
      <pre class="map-snippet" id="map-snippet"></pre>

function wireMappingCard(){
  const bind = (id, key, prop) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener(el.type === "checkbox" ? "change" : "input", () => {
      mappingSettings[key] = el.type === "checkbox" ? el.checked : el.value;
    });
  };
  bind("map-enabled","enabled"); bind("map-campus","campus"); bind("map-visdefault","visitorDefault");
  bind("map-org","org"); bind("map-logo","logo");
  bind("map-accent","accent"); bind("map-header","header"); bind("map-page","page");

  const open = document.getElementById("map-open");
  if(open) open.addEventListener("click", ()=>{
    if(!mappingSettings.enabled){ showToast("Mapping experience is disabled"); return; }
    window.open(mappingLaunchUrl("admin"), "_blank", "noopener");
  });
  const prev = document.getElementById("map-preview");
  if(prev) prev.addEventListener("click", ()=> window.open(mappingLaunchUrl("public"), "_blank", "noopener"));

  const embedBtn = document.getElementById("map-embedbtn");
  const snip = document.getElementById("map-snippet");
  if(embedBtn) embedBtn.addEventListener("click", ()=>{
    snip.textContent = mappingEmbedSnippet();
    snip.classList.toggle("show");
    if(snip.classList.contains("show") && navigator.clipboard){
      navigator.clipboard.writeText(mappingEmbedSnippet()).then(()=> showToast("Embed snippet copied"), ()=>{});
    }
  });
}

const INSTANCE_STATUSES = ["Assigned","Proposed","Inactive (Canceled)","Inactive (Unavailable)","Proposal Draft - Pending Approval"];
const RELATIONS = ["Spouse","Friend","Colleague","Sibling"];
function makeInstance(i){
  const opp = DATA[i % DATA.length];
  const person = PEOPLE[i % PEOPLE.length];
  const status = INSTANCE_STATUSES[i % INSTANCE_STATUSES.length];
  const related = i % 3 === 0 ? [`${PEOPLE[(i+1)%PEOPLE.length]} - ${RELATIONS[i%RELATIONS.length]}`, `${PEOPLE[(i+3)%PEOPLE.length]} - ${RELATIONS[(i+1)%RELATIONS.length]}`] : (i % 3 === 1 ? [`${PEOPLE[(i+2)%PEOPLE.length]} - ${RELATIONS[(i+2)%RELATIONS.length]}`] : []);
  const gifts = [];
  if(i % 2 === 0) gifts.push({amount: (500 + i*137) % 12000 + 250, donor: PEOPLE[(i+4)%PEOPLE.length], date: "02/02/2024", fund: FUNDS[i%FUNDS.length], note: "This was his first installment"});
  if(i % 4 === 0) gifts.push({amount: (i*37) % 900 + 50, donor: PEOPLE[(i+5)%PEOPLE.length], date: "02/19/2026", fund: FUNDS[(i+1)%FUNDS.length], note: "Note goes here"});
  return {
    id: i+1,
    name: `${person} - ${opp.name}`,
    constituent: person,
    opportunityId: opp.id,
    opportunity: opp.name,
    dedication: "-",
    startDate: i % 3 === 0 ? "2025-08-22" : "-",
    endDate: i % 4 === 0 ? "2026-08-07" : "-",
    amount: i % 6 === 0 ? "$" + (15 * (i%9+1)) : "-",
    campaign: i % 2 === 0 ? CAMPAIGNS[i % CAMPAIGNS.length] : "-",
    fund: i % 2 === 0 ? FUNDS[i % FUNDS.length] : "-",
    status,
    dateProposed: i % 3 === 0 ? "2026-05-05" : "-",
    qty: 1,
    relatedConstituents: related,
    fundraiser: i % 2 === 0 ? `${PEOPLE[(i+6)%PEOPLE.length]} - Fundraiser #1` : null,
    gifts,
    customField: i % 3 === 0 ? "Test" : null,
    specificLocation: i % 3 === 0 ? "Sign located on front of building" : null,
    attachments: i % 5 === 0 ? [{name:"Test Document", date:"09/01/2025", size:"0.01 MB"}] : [],
  };
}

          <div class="card-body">
            <div style="font-size:13px;margin-bottom:8px;">Add Picture (0/3)</div>
            <input type="file" disabled style="font-size:12px;">
            <div class="empty-note">No pictures uploaded</div>

            <div style="display:flex;justify-content:space-between;align-items:center;">
              <button class="sky-btn sky-btn-default"><i class="fa fa-plus"></i> Add</button>
              <span style="font-size:12px;color:var(--sky-text-dim);">${totalSize} MB</span>
            </div>
            ${attachHtml || `<div class="empty-note">No attachments found</div>`}
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Tasks</h3><span class="drag">&#8942;&#8942;</span></div>

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".sky-btn-tab").forEach(b=>{
    b.classList.toggle("sky-btn-tab-selected", b.dataset.tab === tab);
  });
  ["list","admin","instances","dashboard"].forEach(t=>{
    document.getElementById("panel-"+t).classList.toggle("hidden", t !== tab);
  });
  if(tab === "admin") renderAdmin();
  if(tab === "instances") renderInstances();
  if(tab === "dashboard") renderDashboard();
}
document.getElementById("tabStrip").querySelectorAll(".sky-btn-tab").forEach(b=>{
  b.addEventListener("click", ()=> switchTab(b.dataset.tab));
});

/* =====================================================================
   Drawer (new / edit)
   ===================================================================== */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

function openDrawer(id){
  editingId = id || null;
  const overlay = document.getElementById("overlay");
  const drawer = document.getElementById("drawer");
  const title = document.getElementById("drawerTitle");
  if(id){
    const r = DATA.find(d=>d.id===id);
    title.textContent = "Edit naming opportunity";
    document.getElementById("f-name").value = r.name;
    document.getElementById("f-desc").value = r.desc;
    document.getElementById("f-loc").value = r.loc;
    document.getElementById("f-type").value = r.type;
    document.getElementById("f-dept").value = r.dept;
    document.getElementById("f-status").value = r.status;
    document.getElementById("f-ask").value = r.askAmount;
    document.getElementById("f-qty").value = r.qty;
  } else {
    title.textContent = "New naming opportunity";
    ["f-name","f-desc","f-loc","f-dept","f-ask"].forEach(id=>document.getElementById(id).value = "");
    document.getElementById("f-type").value = "Internal";
    document.getElementById("f-status").value = "Available";
    document.getElementById("f-qty").value = 1;
  }
  overlay.classList.add("open");
  drawer.classList.add("open");
}

function closeDrawer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
}

document.getElementById("newBtn").addEventListener("click", ()=> openDrawer(null));
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("cancelBtn").addEventListener("click", closeDrawer);
document.getElementById("overlay").addEventListener("click", closeDrawer);

document.getElementById("saveBtn").addEventListener("click", ()=>{
  const vals = {
    name: document.getElementById("f-name").value || "Untitled",
    desc: document.getElementById("f-desc").value,
    loc: document.getElementById("f-loc").value || LOC_PATHS[0],
    type: document.getElementById("f-type").value,
    dept: document.getElementById("f-dept").value,
    status: document.getElementById("f-status").value,
    askAmount: Number(document.getElementById("f-ask").value) || 0,
    qty: Number(document.getElementById("f-qty").value) || 1,
  };
  vals.available = vals.status === "Assigned" ? 0 : vals.qty;
  if(editingId){
    const idx = DATA.findIndex(d=>d.id===editingId);
    DATA[idx] = {...DATA[idx], ...vals};
    showToast("Naming opportunity updated");
  } else {
    DATA.unshift({id: Date.now(), fund:FUNDS[0], campaign:CAMPAIGNS[0], assignedInstance:null, ...vals});
    showToast("Naming opportunity created");
  }
  closeDrawer();
  renderAll();
});

document.getElementById("findInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value; page = 1; renderBody();
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  searchTerm = ""; sortKey = null; sortDir = 1; page = 1;
  document.getElementById("findInput").value = "";
  visibleCols = new Set(COLUMNS.map(c=>c.key));
  renderAll();
});
document.getElementById("columnsBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  const pop = document.getElementById("columnsPop");
  renderColumnsPop();
  pop.classList.toggle("open");
});
document.addEventListener("click", (e)=>{
  const pop = document.getElementById("columnsPop");
  const btn = document.getElementById("columnsBtn");
  if(pop.classList.contains("open") && !pop.contains(e.target) && e.target!==btn){
    pop.classList.remove("open");
  }
});
document.getElementById("filterBtn").addEventListener("click", ()=> showToast("Filter panel — placeholder"));

/* =====================================================================

   ===================================================================== */
renderAll();
switchTab("list");
