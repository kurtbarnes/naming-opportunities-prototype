<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Naming Opportunities Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --blue-primary:#1f6f9e;
    --blue-primary-dark:#175a80;
    --blue-tab:#2589c4;
    --blue-link:#0969a8;
    --blue-pill-bg:#dcf0fb;
    --blue-pill-text:#0969a8;
    --green-pill-bg:#dcf3e2;
    --green-pill-text:#1c7a3d;
    --gray-text:#5a6570;
    --gray-border:#dde3e8;
    --gray-bg:#f4f6f8;
    --row-hover:#f0f7fb;
    --sidebar-bg:#0d3854;
    --sidebar-icon:#a9c6d8;
    --sidebar-icon-active:#ffffff;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:#26313a;font-size:13px;}

  /* ---------- Top header ---------- */
  .topbar{
    height:44px;display:flex;align-items:center;gap:16px;
    padding:0 12px;background:#fff;border-bottom:1px solid var(--gray-border);
  }
  .topbar .hamburger{font-size:18px;color:#5a6570;cursor:pointer;}
  .topbar .brand{font-weight:600;font-size:14px;color:#26313a;white-space:nowrap;}
  .topbar .search{
    flex:1;max-width:420px;display:flex;align-items:center;gap:6px;
    background:var(--gray-bg);border-radius:4px;padding:6px 10px;color:#8a95a0;
  }
  .topbar .search input{border:0;background:transparent;outline:0;flex:1;font-size:13px;color:#26313a;}
  .topbar .spacer{flex:1;}
  .topbar .icon{width:18px;height:18px;color:#5a6570;}
  .topbar .avatar{
    width:26px;height:26px;border-radius:50%;background:var(--blue-primary);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  }

  /* ---------- Layout ---------- */
  .app{display:flex;}
  .sidebar{
    width:44px;background:var(--sidebar-bg);min-height:calc(100vh - 44px);
    display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;
  }
  .sidebar .nav-icon{
    width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    color:var(--sidebar-icon);cursor:pointer;font-size:15px;
  }
  .sidebar .nav-icon:hover{background:rgba(255,255,255,.08);color:#fff;}
  .sidebar .nav-icon.active{background:rgba(255,255,255,.14);color:var(--sidebar-icon-active);}
  .sidebar .plus{
    width:28px;height:28px;border-radius:6px;background:#fff;color:var(--sidebar-bg);
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
    margin-bottom:12px;cursor:pointer;
  }

  .main{flex:1;padding:20px 28px 40px;max-width:1500px;}
  .eyebrow{text-align:right;font-size:11px;color:#8a95a0;margin-bottom:2px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;}
  .page-head h1{font-size:26px;font-weight:600;margin:0;color:#26313a;}
  .head-actions{display:flex;gap:8px;}
  .btn-outline{
    border:1px solid var(--blue-primary);color:var(--blue-primary);background:#fff;
    padding:7px 14px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .btn-outline:hover{background:#eef6fb;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--gray-border);margin-bottom:14px;}
  .tab{
    padding:8px 2px 10px;font-size:13px;color:#5a6570;cursor:pointer;
    border-bottom:2px solid transparent;font-weight:500;
  }
  .tab.active{color:var(--blue-tab);border-bottom-color:var(--blue-tab);font-weight:600;}
  .tab:hover:not(.active){color:#26313a;}

  .count-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .count-row .count{font-size:13px;color:#26313a;font-weight:400;}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .btn-primary{
    background:var(--blue-primary);color:#fff;border:none;padding:8px 14px;border-radius:4px;
    font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .btn-primary:hover{background:var(--blue-primary-dark);}
  .find-box{
    display:flex;align-items:center;gap:6px;border:1px solid var(--gray-border);border-radius:4px;
    padding:6px 10px;min-width:220px;color:#8a95a0;
  }
  .find-box input{border:0;outline:0;font-size:13px;flex:1;color:#26313a;background:transparent;}
  .chk-label{display:flex;align-items:center;gap:6px;font-size:13px;color:#5a6570;white-space:nowrap;}
  .tool-btn{
    display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--gray-border);
    color:#26313a;padding:7px 12px;border-radius:4px;font-size:13px;cursor:pointer;
  }
  .tool-btn:hover{background:var(--gray-bg);}
  .toolbar .grow{flex:1;}

  /* ---------- Table ---------- */
  .table-wrap{border:1px solid var(--gray-border);border-radius:4px;overflow:auto;}
  table{border-collapse:collapse;width:100%;min-width:1180px;}
  thead th{
    text-align:left;font-size:12px;color:#5a6570;font-weight:600;padding:10px 10px;
    border-bottom:1px solid var(--gray-border);white-space:nowrap;cursor:pointer;user-select:none;
    background:#fff;position:sticky;top:0;
  }
  thead th:hover{color:var(--blue-primary);}
  thead th .sort-arrow{font-size:10px;margin-left:4px;color:var(--blue-primary);}
  tbody td{
    padding:10px 10px;border-bottom:1px solid var(--gray-border);vertical-align:top;
    font-size:13px;color:#3a444d;
  }
  tbody tr:hover{background:var(--row-hover);}
  tbody tr.selected{background:#eaf3fa;}
  .col-check{width:30px;}
  .col-icon{width:26px;text-align:center;}
  .row-icon{color:#7c8894;cursor:pointer;font-size:13px;}
  .row-icon:hover{color:var(--blue-primary);}
  .name-link{color:var(--blue-link);font-weight:600;cursor:pointer;text-decoration:none;}
  .name-link:hover{text-decoration:underline;}
  .loc-path{color:#5a6570;font-size:12.5px;line-height:1.4;}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;
  }
  .pill.assigned{background:var(--green-pill-bg);color:var(--green-pill-text);}
  .pill.available{background:var(--blue-pill-bg);color:var(--blue-pill-text);}
  .num{text-align:left;}

  .footer-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;color:#5a6570;font-size:12.5px;}
  .pager{display:flex;gap:4px;align-items:center;}
  .pager button{border:1px solid var(--gray-border);background:#fff;border-radius:4px;padding:5px 9px;cursor:pointer;font-size:12.5px;color:#26313a;}
  .pager button.active{background:var(--blue-primary);color:#fff;border-color:var(--blue-primary);}
  .pager button:hover:not(.active){background:var(--gray-bg);}

  /* ---------- Drawer (New / Edit) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,38,.35);display:none;z-index:50;
  }
  .overlay.open{display:block;}
  .drawer{
    position:fixed;top:0;right:0;height:100%;width:420px;background:#fff;
    box-shadow:-6px 0 18px rgba(0,0,0,.15);transform:translateX(100%);
    transition:transform .22s ease;z-index:51;display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h2{margin:0;font-size:17px;font-weight:600;}
  .drawer-head .close{cursor:pointer;color:#8a95a0;font-size:18px;}
  .drawer-body{padding:18px 22px;overflow-y:auto;flex:1;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:#3a444d;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--gray-border);border-radius:4px;padding:8px 10px;
    font-size:13px;color:#26313a;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .drawer-foot{padding:14px 22px;border-top:1px solid var(--gray-border);display:flex;gap:10px;justify-content:flex-end;}
  .btn-ghost{background:#fff;border:1px solid var(--gray-border);color:#3a444d;padding:8px 16px;border-radius:4px;font-size:13px;cursor:pointer;}
  .btn-ghost:hover{background:var(--gray-bg);}

  .columns-pop{
    position:absolute;background:#fff;border:1px solid var(--gray-border);border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);padding:10px 4px;z-index:40;min-width:200px;display:none;
  }
  .columns-pop.open{display:block;}
  .columns-pop label{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;color:#3a444d;cursor:pointer;}
  .columns-pop label:hover{background:var(--gray-bg);}

  .toast{
    position:fixed;bottom:24px;right:24px;background:#26313a;color:#fff;padding:10px 18px;
    border-radius:4px;font-size:13px;opacity:0;transform:translateY(8px);transition:all .2s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <span class="hamburger">&#9776;</span>
  <span class="brand">Raiser's Edge NXT</span>
  <div class="search">
    <span>&#128269;</span>
    <input placeholder="Search" />
  </div>
  <div class="spacer"></div>
  <span class="icon">&#128276;</span>
  <span class="icon">&#128179;</span>
  <div class="avatar">KB</div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="plus">+</div>
    <div class="nav-icon">&#8962;</div>
    <div class="nav-icon">&#128100;</div>
    <div class="nav-icon">&#128179;</div>
    <div class="nav-icon">&#128101;</div>
    <div class="nav-icon">&#9993;</div>
    <div class="nav-icon active">&#127991;</div>
    <div class="nav-icon">&#128202;</div>
    <div class="nav-icon">&#9881;</div>
    <div class="nav-icon">&#128203;</div>
    <div class="nav-icon">&#9998;</div>
  </div>

  <div class="main">
    <div class="eyebrow">SKY Developer Cohort</div>
    <div class="page-head">
      <h1>Naming Opportunities</h1>
      <div class="head-actions">
        <button class="btn-outline">Objects</button>
        <button class="btn-outline">Instances</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab">Admin Settings</div>
      <div class="tab active">Naming Opportunity List</div>
      <div class="tab">Instance List</div>
      <div class="tab">Dashboard</div>
    </div>

    <div class="count-row">
      <div class="count"><span id="rowCount">0</span> Naming Opportunities</div>
    </div>

    <div class="toolbar">
      <button class="btn-primary" id="newBtn">+ New naming opportunity</button>
      <div class="find-box">
        <span>&#128269;</span>
        <input id="findInput" placeholder="Find in this list" />
      </div>
      <label class="chk-label"><input type="checkbox" id="includeInactive"> Include inactive</label>
      <button class="tool-btn" id="filterBtn">&#9660; Filter</button>
      <div class="grow"></div>
      <button class="tool-btn">&#8593; Export</button>
      <button class="tool-btn" id="resetBtn">&#8635; Reset</button>
      <div style="position:relative;">
        <button class="tool-btn" id="columnsBtn">&#9776; Columns</button>
        <div class="columns-pop" id="columnsPop"></div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="footer-row">
      <div id="footerCount"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">New naming opportunity</h2>
    <span class="close" id="drawerClose">&times;</span>
  </div>
  <div class="drawer-body">
    <div class="field"><label>Name</label><input id="f-name"></div>
    <div class="field"><label>Description</label><textarea id="f-desc"></textarea></div>
    <div class="field"><label>Location</label><input id="f-loc"></div>
    <div class="field"><label>Type</label>
      <select id="f-type"><option>Internal</option><option>General</option><option>Outdoor</option></select>
    </div>
    <div class="field"><label>Specialty / Department</label><input id="f-dept"></div>
    <div class="field"><label>Status</label>
      <select id="f-status"><option>Available</option><option>Assigned</option></select>
    </div>
    <div class="field"><label>Quantity</label><input id="f-qty" type="number" value="1"></div>
  </div>
  <div class="drawer-foot">
    <button class="btn-ghost" id="cancelBtn">Cancel</button>
    <button class="btn-primary" id="saveBtn">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Sample data (structure mirrors the live app) ---------------- */
const TYPES = ["Internal","General","Outdoor"];
const DEPTS = ["Orthopedics","General","Cardiac","Oncology","Neurology","Pediatrics"];
const NAME_POOL = [
  ["Patient Rm","room"],["Group Study Room","study"],["Staff Lounge","lounge"],
  ["Instructional and Research Consultation Room","consult"],["Associate Director of Library Services Offices","office"],
  ["Learning Commons Technology Area","commons"],["Conference Room","conf"],["Nurses Station","nurse"],
  ["Physician Suite","suite"],["Rehabilitation Gym","gym"]
];
const LOC_PATHS = [
  "Example Medical Center > FLOOR 12",
  "Campus > Theatre > 1st Floor",
  "Campus > Main Building > 2nd Floor",
  "Example Medical Center > FLOOR 8"
];

function makeRow(i){
  const [base] = NAME_POOL[i % NAME_POOL.length];
  const num = 12000 + i;
  const isRoom = base.includes("Rm") || base.includes("Room");
  const name = isRoom ? `${base} ${num}` : base;
  const status = (i % 3 === 0) ? "Assigned" : "Available";
  return {
    id: i+1,
    name,
    desc: isRoom ? name : (i % 5 === 0 ? "Will accommodate up to " + (6 + (i%4)*2) + " students" : base + " description"),
    loc: LOC_PATHS[i % LOC_PATHS.length],
    type: TYPES[i % TYPES.length],
    dept: DEPTS[i % DEPTS.length],
    status,
    qty: 1,
    available: status === "Assigned" ? 0 : 1
  };
}

let DATA = Array.from({length: 64}, (_,i) => makeRow(i));

const COLUMNS = [
  {key:"name", label:"Name"},
  {key:"desc", label:"Description"},
  {key:"loc", label:"Location"},
  {key:"type", label:"Type"},
  {key:"dept", label:"Specialty/Department"},
  {key:"status", label:"Status"},
  {key:"qty", label:"Quantity"},
  {key:"available", label:"Available"},
];
let visibleCols = new Set(COLUMNS.map(c=>c.key));

let sortKey = null, sortDir = 1;
let searchTerm = "";
let page = 1;
const PAGE_SIZE = 12;
let editingId = null;

function filteredData(){
  let rows = DATA;
  if(searchTerm.trim()){
    const t = searchTerm.toLowerCase();
    rows = rows.filter(r => r.name.toLowerCase().includes(t) || r.desc.toLowerCase().includes(t) || r.dept.toLowerCase().includes(t));
  }
  if(sortKey){
    rows = [...rows].sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(typeof av === "string") return av.localeCompare(bv) * sortDir;
      return (av-bv) * sortDir;
    });
  }
  return rows;
}

function renderHead(){
  const head = document.getElementById("headRow");
  let html = `<th class="col-check"><input type="checkbox" id="selectAll"></th>
              <th class="col-icon"></th><th class="col-icon"></th><th class="col-icon"></th><th class="col-icon"></th>`;
  COLUMNS.forEach(c=>{
    if(!visibleCols.has(c.key)) return;
    let arrow = "";
    if(sortKey === c.key) arrow = `<span class="sort-arrow">${sortDir===1?"▲":"▼"}</span>`;
    html += `<th data-key="${c.key}">${c.label}${arrow}</th>`;
  });
  head.innerHTML = html;
  head.querySelectorAll("th[data-key]").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      renderAll();
    });
  });
  document.getElementById("selectAll").addEventListener("change", (e)=>{
    document.querySelectorAll(".row-select").forEach(cb=>{ cb.checked = e.target.checked; cb.dispatchEvent(new Event('change')); });
  });
}

function statusPill(status){
  const cls = status === "Assigned" ? "assigned" : "available";
  return `<span class="pill ${cls}">${status}</span>`;
}

function renderBody(){
  const rows = filteredData();
  document.getElementById("rowCount").textContent = DATA.length;
  const start = (page-1)*PAGE_SIZE;
  const pageRows = rows.slice(start, start+PAGE_SIZE);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = pageRows.map(r=>{
    let cells = "";
    COLUMNS.forEach(c=>{
      if(!visibleCols.has(c.key)) return;
      if(c.key === "name"){
        cells += `<td><a class="name-link" data-id="${r.id}">${r.name}</a></td>`;
      } else if(c.key === "loc"){
        cells += `<td class="loc-path">${r.loc}</td>`;
      } else if(c.key === "status"){
        cells += `<td>${statusPill(r.status)}</td>`;
      } else if(c.key === "qty" || c.key === "available"){
        cells += `<td class="num">${r[c.key]}</td>`;
      } else {
        cells += `<td>${r[c.key]}</td>`;
      }
    });
    return `<tr data-id="${r.id}">
      <td class="col-check"><input type="checkbox" class="row-select" data-id="${r.id}"></td>
      <td class="col-icon"><span class="row-icon edit-icon" data-id="${r.id}" title="Edit">&#9998;</span></td>
      <td class="col-icon"><span class="row-icon" title="Settings">&#9881;</span></td>
      <td class="col-icon"><span class="row-icon" title="Assign">&#128100;</span></td>
      <td class="col-icon"><span class="row-icon" title="Notes">&#128196;</span></td>
      ${cells}
    </tr>`;
  }).join("");

  tbody.querySelectorAll(".name-link, .edit-icon").forEach(el=>{
    el.addEventListener("click", ()=> openDrawer(Number(el.dataset.id)));
  });
  tbody.querySelectorAll(".row-select").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      cb.closest("tr").classList.toggle("selected", cb.checked);
    });
  });

  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(page > totalPages) page = totalPages;
  document.getElementById("footerCount").textContent =
    total === 0 ? "No results" : `Showing ${start+1}-${Math.min(start+PAGE_SIZE,total)} of ${total}`;

  const pager = document.getElementById("pager");
  let phtml = `<button ${page===1?"disabled":""} id="prevPage">&#8249;</button>`;
  for(let p=1; p<=totalPages; p++){
    phtml += `<button class="${p===page?"active":""}" data-p="${p}">${p}</button>`;
  }
  phtml += `<button ${page===totalPages?"disabled":""} id="nextPage">&#8250;</button>`;
  pager.innerHTML = phtml;
  pager.querySelectorAll("button[data-p]").forEach(b=>{
    b.addEventListener("click", ()=>{ page = Number(b.dataset.p); renderBody(); });
  });
  const prevBtn = document.getElementById("prevPage");
  const nextBtn = document.getElementById("nextPage");
  if(prevBtn) prevBtn.addEventListener("click", ()=>{ if(page>1){page--; renderBody();} });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{ if(page<totalPages){page++; renderBody();} });
}

function renderColumnsPop(){
  const pop = document.getElementById("columnsPop");
  pop.innerHTML = COLUMNS.map(c=>`
    <label><input type="checkbox" data-key="${c.key}" ${visibleCols.has(c.key)?"checked":""}> ${c.label}</label>
  `).join("");
  pop.querySelectorAll("input").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      if(cb.checked) visibleCols.add(cb.dataset.key); else visibleCols.delete(cb.dataset.key);
      renderAll();
    });
  });
}

function renderAll(){
  renderHead();
  renderBody();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 1800);
}

function openDrawer(id){
  editingId = id || null;
  const overlay = document.getElementById("overlay");
  const drawer = document.getElementById("drawer");
  const title = document.getElementById("drawerTitle");
  if(id){
    const r = DATA.find(d=>d.id===id);
    title.textContent = "Edit naming opportunity";
    document.getElementById("f-name").value = r.name;
    document.getElementById("f-desc").value = r.desc;
    document.getElementById("f-loc").value = r.loc;
    document.getElementById("f-type").value = r.type;
    document.getElementById("f-dept").value = r.dept;
    document.getElementById("f-status").value = r.status;
    document.getElementById("f-qty").value = r.qty;
  } else {
    title.textContent = "New naming opportunity";
    ["f-name","f-desc","f-loc","f-dept"].forEach(id=>document.getElementById(id).value = "");
    document.getElementById("f-type").value = "Internal";
    document.getElementById("f-status").value = "Available";
    document.getElementById("f-qty").value = 1;
  }
  overlay.classList.add("open");
  drawer.classList.add("open");
}

function closeDrawer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
}

document.getElementById("newBtn").addEventListener("click", ()=> openDrawer(null));
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("cancelBtn").addEventListener("click", closeDrawer);
document.getElementById("overlay").addEventListener("click", closeDrawer);

document.getElementById("saveBtn").addEventListener("click", ()=>{
  const vals = {
    name: document.getElementById("f-name").value || "Untitled",
    desc: document.getElementById("f-desc").value,
    loc: document.getElementById("f-loc").value || LOC_PATHS[0],
    type: document.getElementById("f-type").value,
    dept: document.getElementById("f-dept").value,
    status: document.getElementById("f-status").value,
    qty: Number(document.getElementById("f-qty").value) || 1,
  };
  vals.available = vals.status === "Assigned" ? 0 : vals.qty;
  if(editingId){
    const idx = DATA.findIndex(d=>d.id===editingId);
    DATA[idx] = {...DATA[idx], ...vals};
    showToast("Naming opportunity updated");
  } else {
    DATA.unshift({id: Date.now(), ...vals});
    showToast("Naming opportunity created");
  }
  closeDrawer();
  renderAll();
});

document.getElementById("findInput").addEventListener("input", (e)=>{
  searchTerm = e.target.value; page = 1; renderBody();
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  searchTerm = ""; sortKey = null; sortDir = 1; page = 1;
  document.getElementById("findInput").value = "";
  visibleCols = new Set(COLUMNS.map(c=>c.key));
  renderAll();
});
document.getElementById("columnsBtn").addEventListener("click", (e)=>{
  const pop = document.getElementById("columnsPop");
  renderColumnsPop();
  pop.classList.toggle("open");
});
document.addEventListener("click", (e)=>{
  const pop = document.getElementById("columnsPop");
  const btn = document.getElementById("columnsBtn");
  if(pop.classList.contains("open") && !pop.contains(e.target) && e.target!==btn){
    pop.classList.remove("open");
  }
});
document.getElementById("filterBtn").addEventListener("click", ()=> showToast("Filter panel — placeholder"));

renderAll();
</script>
</body>
</html>
